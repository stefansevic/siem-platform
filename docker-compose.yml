  #   environment:
  #     POSTGRES_HOST: ${POSTGRES_HOST}
  #     REDIS_HOST: ${REDIS_HOST}
  #   ports:
  #     - "${API_GATEWAY_PORT}:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   networks:
  #     - siem-net

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   container_name: siem-frontend
  #   restart: unless-stopped
  #   environment:
  #     VITE_API_URL: ${VITE_API_URL}
  #   ports:
  #     - "${FRONTEND_PORT}:3000"
  #   depends_on:
  #     - api-gateway
  #   networks:
  #     - siem-net


# ----------------------------------------
# NETWORKS & VOLUMES
# ----------------------------------------

networks:
  siem-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs: