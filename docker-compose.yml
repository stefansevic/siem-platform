# ============================================
# SIEM Platform - Docker Compose
# ============================================
# Brings up the entire infrastructure for local development.
# Usage:
#   docker compose up -d        # Start all services in background
#   docker compose logs -f      # Follow logs from all services
#   docker compose down         # Stop and remove containers
#   docker compose down -v      # Also remove volumes (clean slate)

name: siem-platform

services:

  # ----------------------------------------
  # INFRASTRUCTURE
  # ----------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - siem-net

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - siem-net

  # ----------------------------------------
  # LOG SOURCES
  # ----------------------------------------

  demo-webapp:
    build:
      context: ./log-sources/demo-webapp
      dockerfile: Dockerfile
    container_name: siem-demo-webapp
    restart: unless-stopped
    environment:
          DEMO_WEBAPP_SECRET_KEY: ${DEMO_WEBAPP_SECRET_KEY}
          INGESTOR_URL: http://ingestor:8001/logs
          INGESTOR_TIMEOUT_SECONDS: "1.0"
    ports:
      - "${DEMO_WEBAPP_PORT}:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - siem-net

  nginx:
    build:
      context: ./log-sources/nginx
      dockerfile: Dockerfile
    container_name: siem-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
    volumes:
      - nginx_logs:/var/log/nginx
    depends_on:
      demo-webapp:
        condition: service_healthy
    networks:
      - siem-net

  # ----------------------------------------
  # SIEM SERVICES (uncomment as we build them)
  # ----------------------------------------

  ingestor:
    build:
      context: .
      dockerfile: services/ingestor/Dockerfile
    container_name: siem-ingestor
    restart: unless-stopped
    environment:
      INGESTOR_HOST: ${INGESTOR_HOST}
      INGESTOR_PORT: ${INGESTOR_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
      NGINX_ACCESS_LOG_PATH: /var/log/nginx/access.log
      ENABLE_NGINX_TAILER: "true"
    ports:
      - "${INGESTOR_PORT}:8001"
    volumes:
      - nginx_logs:/var/log/nginx:ro
    depends_on:
      redis:
        condition: service_healthy
      nginx:
        condition: service_started
    networks:
      - siem-net

  normalizer:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    container_name: siem-normalizer
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siem-net

  correlator:
    build:
      context: .
      dockerfile: services/correlator/Dockerfile
    container_name: siem-correlator
    restart: unless-stopped
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - siem-net

  alert-manager:
    build:
      context: .
      dockerfile: services/alert-manager/Dockerfile
    container_name: siem-alert-manager
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      ALERT_SILENCE_WINDOW_SECONDS: ${ALERT_SILENCE_WINDOW_SECONDS:-300}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - siem-net

  # api-gateway:
  #   build:
  #     context: ./services/api-gateway
  #     dockerfile: Dockerfile
  #   container_name: siem-api-gateway
