# ============================================
# SPA-friendly nginx config for the SIEM frontend.
# ============================================
# React Router uses client-side routing — the user can land on
# /incidents directly. Nginx must serve index.html for any path that
# does not match a real file, so the SPA can take over routing.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: try the requested file, then fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively. Vite emits content-hashed
    # filenames so cache invalidation is automatic on rebuilds.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The HTML shell must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}