# ============================================
# SIEM Platforma - Nginx reverse proxy konfiguracija
# ============================================
# Ulazna tačka ispred demo aplikacije: sav saobraćaj prolazi kroz
# Nginx. Access log koji pritom nastaje je naš drugi izvor logova -
# Ingestor ga tail-uje i prosleđuje Normalizeru.

# Naš format loga - proširuje standardni Combined format sa vremenom
# odgovora i upstream podacima, korisnim za korelaciju.
log_format siem_combined
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" '
    'uht="$upstream_header_time" urt="$upstream_response_time"';

# Access log location - this is what the Ingestor will tail
access_log /var/log/nginx/access.log siem_combined;
error_log  /var/log/nginx/error.log warn;

# Upstream definition: our demo webapp
upstream demo_webapp {
    server demo-webapp:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Increase max body size for testing
    client_max_body_size 10M;

    # Health check endpoint (handled by Nginx, not proxied)
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # Health check probe - proxied to the webapp but not logged.
    # Hit every 5 seconds by Docker; would otherwise dominate the
    # SIEM event stream with /health entries.
    location = /health {
        access_log off;
        proxy_pass http://demo_webapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Proxy everything else to the demo webapp
    location / {
        proxy_pass http://demo_webapp;
        proxy_http_version 1.1;

        # Forward original client info to the upstream app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}