# ============================================
# SIEM Platform - Nginx Reverse Proxy Config
# ============================================
# Acts as the public-facing entry point for the demo webapp.
# Generates access logs in extended Combined Log Format
# which the Ingestor will tail and forward to the Normalizer.

# Custom log format - extends the default Combined format
# with response time and upstream info for better correlation
log_format siem_combined
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time uct="$upstream_connect_time" '
    'uht="$upstream_header_time" urt="$upstream_response_time"';

# Access log location - this is what the Ingestor will tail
access_log /var/log/nginx/access.log siem_combined;
error_log  /var/log/nginx/error.log warn;

# Upstream definition: our demo webapp
upstream demo_webapp {
    server demo-webapp:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Increase max body size for testing
    client_max_body_size 10M;

    # Health check endpoint (handled by Nginx, not proxied)
    location /nginx-health {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    # Proxy everything else to the demo webapp
    location / {
        proxy_pass http://demo_webapp;
        proxy_http_version 1.1;

        # Forward original client info to the upstream app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}