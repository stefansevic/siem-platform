name: distributed_brute_force
description: |
  Distribuirani brute-force: 5 napadačkih IP, svaka po 4 neuspeha na
  'admin'. Ukupno 20 neuspeha na isti nalog, ali nijedna IP ne prelazi
  brute_force prag (5 u 60s).

  SIEM NE treba da detektuje ovo - brute_force grupiše po source IP, ne
  po username-u. Dokumentovana mana (budući rad).

  Rešenja iz rada: pravila po username-u, globalni rate-limiteri, ili
  behavior baseline koji hvata redak obrazac neuspeh-uspeh bez obzira na IP.

  Napomena: saobraćaj ide direktno na webapp (port 9000), pa X-Forwarded-For
  nosi lažiranu napadačku IP. Kroz Nginx (8080) bi Nginx prepisao header.

expected_incidents: []

steps:
  - type: parallel
    children:
      - type: attack
        script: brute_force.py
        args:
          - --target-url
          - http://localhost:9000
          - --username
          - admin
          - --attempts
          - "4"
          - --delay
          - "0.4"
          - --spoof-ip
          - "10.0.0.10"

      - type: attack
        script: brute_force.py
        args:
          - --target-url
          - http://localhost:9000
          - --username
          - admin
          - --attempts
          - "4"
          - --delay
          - "0.4"
          - --spoof-ip
          - "10.0.0.11"

      - type: attack
        script: brute_force.py
        args:
          - --target-url
          - http://localhost:9000
          - --username
          - admin
          - --attempts
          - "4"
          - --delay
          - "0.4"
          - --spoof-ip
          - "10.0.0.12"

      - type: attack
        script: brute_force.py
        args:
          - --target-url
          - http://localhost:9000
          - --username
          - admin
          - --attempts
          - "4"
          - --delay
          - "0.4"
          - --spoof-ip
          - "10.0.0.13"

      - type: attack
        script: brute_force.py
        args:
          - --target-url
          - http://localhost:9000
          - --username
          - admin
          - --attempts
          - "4"
          - --delay
          - "0.4"
          - --spoof-ip
          - "10.0.0.14"

  - type: wait
    seconds: 5