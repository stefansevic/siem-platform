name: nat_false_positive
description: |
  NAT false positive: 3 korisnika (alice, bob, carol) svaki 2 puta
  pogreši šifru sa ISTE deljene IP. Ukupno 6 neuspeha kroz 3 naloga.

  brute_force grupiše samo po source_ip (industrijski standard), pa SIEM
  OKINE iako nijedan pojedinačan nalog nije napadnut. To je dokumentovana
  NAT mana (ADR-022, budući rad). Rešenje: grupisanje po (IP, user) ili UEBA.

expected_incidents: []

steps:
  - type: parallel
    children:
      - type: attack
        script: brute_force.py
        args:
          - --username
          - alice
          - --attempts
          - "2"
          - --delay
          - "0.4"
      - type: attack
        script: brute_force.py
        args:
          - --username
          - bob
          - --attempts
          - "2"
          - --delay
          - "0.4"
      - type: attack
        script: brute_force.py
        args:
          - --username
          - carol
          - --attempts
          - "2"
          - --delay
          - "0.4"
  - type: wait
    seconds: 5