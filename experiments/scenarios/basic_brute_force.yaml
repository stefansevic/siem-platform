name: basic_brute_force
description: |
  Prost brute-force napad na jedan nalog, bez pozadinskog šuma.
  Provera da brute_force pravilo okine i da incident prođe ceo pipeline.

expected_incidents:
  - rule: brute_force
    user: admin

steps:
  - type: attack
    script: brute_force.py
    args:
      - --username
      - admin
      - --attempts
      - "8"
      - --delay
      - "0.3"

  - type: wait
    seconds: 3