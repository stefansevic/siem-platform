name: slow_burst_brute_force
description: |
  Granični slučaj kliznog prozora: 6 neuspeha razmaknutih po 16s, kroz
  90s. Prozor je 60s, pa u bilo kom prozoru ima najviše 4-5 neuspeha.
  Da li okine zavisi od tačnog tajminga kad se pravilo ponovo evaluira.
  Pokazuje osetljivost korelacije sa fiksnim prozorom na tempo napada.

expected_incidents:
  - rule: brute_force
    user: bob

steps:
  - type: attack
    script: brute_force.py
    args:
      - --username
      - bob
      - --attempts
      - "6"
      - --delay
      - "16"
  - type: wait
    seconds: 5