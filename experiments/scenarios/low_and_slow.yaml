name: low_and_slow
description: |
  Low-and-slow napad: 4 neuspeha razvučena kroz 60 sekundi. Usporeni
  pokušaji ostaju ispod brute_force praga (5 neuspeha u 60s). SIEM NE
  sme da ovo detektuje kao napad - to je očekivana mana pravila
  zasnovanih na pragu.

  Dokumentovano kao poznat False Negative (budući rad). Moguća rešenja:
  ML detekcija, dinamički baseline (u stilu Datadog-a), ili duži prozori
  agregacije sa nižim pragom.

expected_incidents: []

steps:
  - type: attack
    script: brute_force.py
    args:
      - --username
      - alice
      - --attempts
      - "4"
      - --delay
      - "15"

  - type: wait
    seconds: 5