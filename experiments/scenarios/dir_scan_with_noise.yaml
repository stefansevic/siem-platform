name: dir_scan_with_noise
description: |
  Napad skeniranja direktorijuma paralelno sa normalnim saobraćajem.
  Proverava da legitimni pregledi i poneki 404 od pravih korisnika ne
  doprinose okidanju directory_scanning-a, i da se za napadača napravi
  tačno jedan takav incident.

expected_incidents:
  - rule: directory_scanning
    severity: medium
    min_count: 1

steps:
  - type: parallel
    children:
      - type: attack
        script: traffic_normal.py
        args:
          - --target-url
          - http://localhost:9000
          - --duration
          - "30"
          - --delay
          - "0.5"
          - --spoof-ip-base
          - "10.0.1.0"

      - type: attack
        script: directory_scan.py
        args:
          - --paths-count
          - "30"
          - --delay
          - "0.5"

  - type: wait
    seconds: 3