name: mixed_legitimate_and_attack
description: |
  Realističan mešani scenario: brute_force napad ide paralelno sa
  legitimnim saobraćajem (3 korisnika na različitim lažiranim IP).

  SIEM treba da detektuje brute_force na admin (TP) i da NE napravi
  nijedan drugi incident iz šuma. Potvrđuje da legitiman saobraćaj ne
  okida lažni directory_scanning ni account_takeover.

expected_incidents:
  - rule: brute_force
    severity: high
    min_count: 1

steps:
  - type: parallel
    children:
      - type: attack
        script: brute_force.py
        args:
          - --username
          - admin
          - --attempts
          - "8"
          - --delay
          - "0.3"
      - type: attack
        script: traffic_normal.py
        args:
          - --target-url
          - http://localhost:9000
          - --duration
          - "30"
          - --delay
          - "0.5"
          - --users
          - "3"
          - --spoof-ip-base
          - "10.0.2.0"
  - type: wait
    seconds: 5