name: basic_ato
description: |
  Account-takeover scenario: 5 neuspeha praćenih uspehom za isti nalog.
  Očekuje se da okinu i brute_force i account_takeover pravila.

expected_incidents:
  - rule: brute_force
    severity: high
    min_count: 1
  - rule: account_takeover
    severity: critical
    min_count: 1

steps:
  - type: attack
    script: account_takeover.py
    args:
      - --username
      - alice
      - --password
      - "Wonderland2024!"
      - --failed
      - "5"
      - --delay
      - "0.3"

  - type: wait
    seconds: 3