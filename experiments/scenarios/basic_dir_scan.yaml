name: basic_dir_scan
description: |
  Prost napad skeniranja direktorijuma sa ugrađenom wordlistom, bez
  pozadinskog šuma. Provera directory_scanning pravila.

expected_incidents:
  - rule: directory_scanning
    severity: medium
    min_count: 1

steps:
  - type: attack
    script: directory_scan.py
    args:
      - --paths-count
      - "30"
      - --delay
      - "0.1"

  - type: wait
    seconds: 3