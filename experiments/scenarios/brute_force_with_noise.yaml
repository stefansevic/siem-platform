name: brute_force_with_noise
description: |
  Brute-force napad na admin dok legitimni korisnici aktivno koriste
  aplikaciju. Testira da SIEM razlikuje napad od pozadinskog saobraćaja
  - treba da okine tačno jedan brute_force incident, bez lažnih alarma
  od normalnog toka.

expected_incidents:
  - rule: brute_force
    user: admin

steps:
  - type: parallel
    children:
      - type: attack
        script: traffic_normal.py
        args:
          - --target-url
          - http://localhost:9000
          - --duration
          - "30"
          - --delay
          - "0.5"
          - --spoof-ip-base
          - "10.0.1.0"

      - type: attack
        script: brute_force.py
        args:
          - --username
          - admin
          - --attempts
          - "8"
          - --delay
          - "1.5"

  - type: wait
    seconds: 3