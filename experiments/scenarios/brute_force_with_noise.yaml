name: brute_force_with_noise
description: |
  Brute-force attack against admin while legitimate users are actively
  using the application. Tests that the SIEM distinguishes the attack
  from background traffic — only one brute_force incident should fire,
  and no false positives should appear from the normal flow.

expected_incidents:
  - rule: brute_force
    severity: high
    min_count: 1

steps:
  - type: parallel
    children:
      - type: attack
        script: traffic_normal.py
        args:
          - --target-url
          - http://localhost:9000
          - --duration
          - "30"
          - --delay
          - "0.5"
          - --spoof-ip-base
          - "10.0.1.0"

      - type: attack
        script: brute_force.py
        args:
          - --username
          - admin
          - --attempts
          - "8"
          - --delay
          - "1.5"

  - type: wait
    seconds: 3