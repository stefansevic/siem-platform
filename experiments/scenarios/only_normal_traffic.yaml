name: only_normal_traffic
description: |
  Control group: legitimate users only, no attack. The SIEM must NOT
  generate any incidents. Any incident here counts as a False Positive
  for the Precision metric.

  Validates the per-user matching fix in the account_takeover rule
  (Week 8) — without that fix, three users typo-ing their passwords
  while a fourth logs in normally was triggering an ATO incident.

expected_incidents: []

steps:
  - type: attack
    script: traffic_normal.py
    args:
      - --target-url
      - http://localhost:9000
      - --duration
      - "60"
      - --delay
      - "0.5"
      - --spoof-ip-base
      - "10.0.1.0"

  - type: wait
    seconds: 3